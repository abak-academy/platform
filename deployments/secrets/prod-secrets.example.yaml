# Copy to deployments/secrets/prod-secrets.yaml on the box (gitignored) and
# fill every value. Mounted read-only into api + worker at
# /app/config/env/prod/secrets.yaml — the config loader reads it alongside the
# baked-in config.yaml. Never commit real values.
#
# Required (fail-fast: api/worker refuse to start if any is empty):
database_url: "postgres://abak:CHANGE_ME@10.20.0.10:6432/abak_academy?sslmode=disable"
# Optional: direct (unpooled) DSN for running migrations, bypassing PgBouncer.
# Falls back to database_url when unset. On prod this MUST be set — PgBouncer
# runs in transaction pooling mode here, and DDL cannot cross transaction
# pooling.
migration_database_url: "postgres://abak:CHANGE_ME@10.20.0.10:5432/abak_academy?sslmode=disable"
jwt_secret: ""
config_encryption_key: ""            # 32-byte hex
otp_secret: ""
# GCS S3-interop HMAC key (Cloud Console -> Storage -> Settings -> Interoperability):
object_storage_access_key: ""
object_storage_secret_key: ""
# Optional (leave empty to disable the feature):
redis_password: ""
fazpass_merchant_key: ""
fazpass_api_key: ""
# Go-live slot: Midtrans production keys are not obtained yet. Midtrans keys
# are normally entered in the admin dashboard (DB-sourced); these are only a
# fallback. Leaving them empty means the payment webhook rejects every call
# until keys are set — which is the correct secure default.
midtrans_server_key: ""
midtrans_client_key: ""
# SMTP for email OTP (config.yaml already sets smtp_host=smtp.gmail.com on prod).
# Gmail: smtp_username = full address, smtp_password = 16-char App Password (no spaces).
smtp_username: ""
smtp_password: ""
