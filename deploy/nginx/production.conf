# Production front door for hub.abakacademy.id. Single public entrypoint:
# /api -> Go API, everything else -> Next.js.
#
# TLS is Cloudflare Full (strict): this is a Cloudflare Origin Certificate, not a
# publicly-trusted cert, so there is deliberately no ACME renewal client on this
# path (unlike staging) — the firewall admits only 443, and Cloudflare terminates
# the client-facing edge TLS and the :80 redirect. Authenticated Origin Pulls
# (origin mTLS) is a later hardening layer, not enabled here.

# Docker's embedded DNS. Deliberately no `upstream` blocks: those resolve once at
# config load and cache the IP for the process lifetime, so recreating only the api
# container 502s every /api/ route until nginx is restarted — this project has lost
# an environment to exactly that. Resolving per request also lets nginx start before
# api and web exist, instead of failing with "host not found in upstream".
resolver 127.0.0.11 valid=10s ipv6=off;

# Published Cloudflare IP ranges — authority: https://www.cloudflare.com/ips/
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;
real_ip_recursive on;

# gzip_proxied keys off the Via REQUEST header, not proxy_pass: nginx defaults
# it to `off`, denying compression to requests that arrive carrying Via (some
# corporate and carrier proxies). `any` keeps those clients compressed too.
# gzip_vary keeps a cached edge (Cloudflare) from serving a compressed body to
# a client that didn't ask.
gzip on;
gzip_proxied any;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types application/json application/javascript text/css text/plain application/xml;

# §8 of issue #98: rate, upstream_response_time and compression ratio come
# from these access logs, shipped by Alloy like every other container's
# stdout — no extra exporter process. Everything is a quoted string so "-"
# placeholders (no upstream, HEAD with no bytes) stay valid JSON for LogQL's
# | json parser.
log_format json_access escape=json '{"time":"$time_iso8601","remote":"$http_cf_connecting_ip","method":"$request_method","uri":"$request_uri","status":"$status","request_time":"$request_time","upstream_time":"$upstream_response_time","bytes_sent":"$bytes_sent","body_bytes_sent":"$body_bytes_sent"}';

server {
    listen 443 ssl;
    server_name hub.abakacademy.id;

    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;

    access_log /dev/stdout json_access;

    # The hostname must go through a variable, or nginx resolves it at load time
    # and caches the result — the whole point of the resolver above.
    location /api/ {
        set $api_upstream api:8080;
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        set $web_upstream web:3000;
        proxy_pass http://$web_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
