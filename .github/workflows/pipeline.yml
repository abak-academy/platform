name: pipeline

on:
  # Unfiltered `push:` + `pull_request:` fired BOTH for every push to a branch
  # with an open PR, so each push burned two identical runs — two ~11-minute
  # backend jobs, two frontend, and two render-gates that each build the web and
  # api images from scratch. Branch work is covered by pull_request; push is only
  # needed for main, which is where the images/images-prod jobs are gated anyway.
  push:
    branches: [main]
  pull_request:

# Without this, three pushes in a row leave six runs racing and none cancelled,
# even though only the newest ref matters. Not on main: those runs publish images to
# two registries from three jobs, and a cancelled one leaves a partial tag set.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: backend/go.sum
      - name: pipeline
        run: ./deploy/pipeline/backend.sh

  render-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: backend/go.sum
      # pdftoppm rasterizes the rendered PDF for the gate's pixel assertions;
      # without it renderToPNG skips and the gate silently stops checking layout.
      - name: install poppler-utils
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      # NFR-R4/FR-30 (async redesign 2026-08-02): certificates/cards render
      # through GenerateCertificatePDF/generateExamCardPDF straight to
      # Gotenberg now, so the script below only needs postgres/minio/gotenberg
      # from deploy/compose/local.yml before running go test — ubuntu-latest
      # ships Docker + the compose plugin already, no extra setup step needed.
      - name: certificate render gate
        run: ./deploy/pipeline/backend-render-gate.sh

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      # Vitest sanitizer-bridge tests (tiptap-spike / RichTextEditor) spawn
      # `go test` against backend/internal/service. Without this, the runner's
      # older Go tries to download go1.25.0 from proxy.golang.org and 403s.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: backend/go.sum
      - name: pipeline
        run: ./deploy/pipeline/frontend.sh

  # api and worker are byte-identical for staging and prod — same binaries, same Dockerfiles,
  # no environment baked in. Built once here and pushed to both registries; the second
  # build-image.sh call is a docker layer-cache hit and only re-tags.
  # Requires GitHub-side setup: vars.GCP_WORKLOAD_IDENTITY_PROVIDER, vars.GCP_DEPLOY_SERVICE_ACCOUNT.
  images-backend:
    if: github.ref == 'refs/heads/main'
    needs: [backend, render-gate, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write          # WIF: no service-account key exists anywhere
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: backend/go.sum
      - name: build artifact
        run: ./deploy/pipeline/build-artifact.sh
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: configure docker for artifact registry
        run: gcloud auth configure-docker asia-southeast2-docker.pkg.dev --quiet
      - name: build and push api + worker to ghcr
        env:
          REGISTRY: ghcr.io/${{ github.repository }}
          TAG: ${{ github.sha }}
          PUSH: '1'
          COMPONENTS: api worker
        run: ./deploy/pipeline/build-image.sh
      - name: push api + worker to artifact registry
        env:
          REGISTRY: asia-southeast2-docker.pkg.dev/abak-academy-platform/app
          TAG: ${{ github.sha }}
          PUSH: '1'
          COMPONENTS: api worker
        run: ./deploy/pipeline/build-image.sh

  # web is not promotable between environments: NEXT_PUBLIC_* is inlined into the client
  # bundle, so staging and prod are separate builds. No Go toolchain needed.
  images-web:
    if: github.ref == 'refs/heads/main'
    needs: [backend, render-gate, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build and push web
        env:
          REGISTRY: ghcr.io/${{ github.repository }}
          TAG: ${{ github.sha }}
          PUSH: '1'
          COMPONENTS: web
          TARGET_ENV: staging
          NEXT_PUBLIC_API_BASE_URL: https://stg.abakacademy.id/api/v1
          NEXT_PUBLIC_MIDTRANS_CLIENT_KEY: ${{ secrets.MIDTRANS_CLIENT_KEY }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: 823500183775-miq3ligvku7uota4tkodatkie4gnp4u4.apps.googleusercontent.com
        run: ./deploy/pipeline/build-image.sh

  # vars.PROD_GOOGLE_CLIENT_ID and secrets.MIDTRANS_CLIENT_KEY_PROD are go-live slots, still empty.
  images-web-prod:
    if: github.ref == 'refs/heads/main'
    needs: [backend, render-gate, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: configure docker for artifact registry
        run: gcloud auth configure-docker asia-southeast2-docker.pkg.dev --quiet
      - name: build and push web
        env:
          REGISTRY: asia-southeast2-docker.pkg.dev/abak-academy-platform/app
          TAG: ${{ github.sha }}
          PUSH: '1'
          COMPONENTS: web
          TARGET_ENV: prod
          NEXT_PUBLIC_API_BASE_URL: https://hub.abakacademy.id/api/v1
          NEXT_PUBLIC_MIDTRANS_SNAP_URL: https://app.midtrans.com/snap/snap.js
          NEXT_PUBLIC_MIDTRANS_CLIENT_KEY: ${{ secrets.MIDTRANS_CLIENT_KEY_PROD }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.PROD_GOOGLE_CLIENT_ID }}
        run: ./deploy/pipeline/build-image.sh
