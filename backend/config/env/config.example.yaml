# Template for <env>/config.yaml (non-secret values). For local dev:
#   cp config.example.yaml dev/config.yaml
#   cp secrets.example.yaml dev/secrets.yaml
# Hostnames below match the docker-compose network; for bare `go run` against
# host-mapped ports use localhost:5432 / localhost:6379 / localhost:9000.
http_port: "8080"
redis_addr: "redis:6379"
worker_poll_interval: "5s"
cors_origins:
  - "http://localhost:3000"
access_token_ttl: "15m"
refresh_token_ttl: "168h"
otp_ttl: "5m"
# OTP send/verify protection knobs (konsep-otp.md §6/§9). All zero-safe: the
# service falls back to these defaults per knob when a key is unset.
otp_quota_hour: 3
otp_quota_day: 8
otp_quota_ip_hour: 20
otp_sendfail_max: 3
otp_sendfail_pause: "30s"
# Wrong-entry budgets (not reset by a resend) and the per-code attempt limit.
otp_vfail_hour: 10
otp_vfail_day: 20
otp_vfail_ip_hour: 30
otp_attempts: 3
# Global daily email-send ceiling shared by every OTP password-reset flow
# (announcements are not counted). Resets at WIB midnight. Default 500.
smtp_quota_day: 500
google_client_id: ""
fazpass_base_url: "https://api.fazpass.com"
midtrans_env: "sandbox"
# SMTP for email OTP/notifications. Leave smtp_host empty to fall back to Fazpass
# (or the Noop logger when Fazpass is also unset). Username/password go in secrets.
smtp_host: ""
smtp_port: "587"
smtp_from: ""
smtp_from_name: ""
# Announcement email fan-out pacing in the worker (emails per minute). Keeps a
# large broadcast from bursting past the SMTP relay's rate limit. Default 30.
email_send_per_minute: 30
object_storage_endpoint: "minio:9000"
object_storage_public_endpoint: "localhost:9000"
object_storage_use_ssl: false
object_storage_region: "us-east-1"
object_storage_bucket_name: "akademi-bimbel"
object_storage_private_bucket_name: "akademi-bimbel-private"

# api 10 + worker 10 = 20 clients, measured 2026-08-13 against PgBouncer on 10.20.0.10: max_client_conn=500, default_pool_size=20, transaction mode; Postgres max_connections=100.
db_max_conns: 10

# Gotenberg (HTML->PDF renderer) sidecar URL. Deploy-topology, not a secret;
# points at the compose service.
gotenberg_url: "http://gotenberg:3000"

# Internal origin Gotenberg uses to fetch print routes (certificates, cards).
# Deploy-topology, not a secret; points at the web service, not the public host.
