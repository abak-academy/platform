# Template for environment-specific secrets files.
#
# Local dev:   cp secrets.example.yaml dev/secrets.yaml — the values below match
#              deploy/compose/local.yml and work as-is.
# Staging/prod: copy to staging/secrets.yaml or prod/secrets.yaml on the machine
#              (both paths are gitignored) and replace EVERY value with a real
#              secret. NEVER commit real secret values.
#
# Required secrets (fail-fast: must be non-empty for staging/prod):
database_url: "postgres://akademi:akademi@postgres:5432/akademi?sslmode=disable"
# Optional: direct (unpooled) DSN for running migrations, bypassing PgBouncer.
# Leave unset/empty to fall back to database_url — correct for setups (like this
# one) where there is no pooler in front of Postgres.
migration_database_url: ""
jwt_secret: "dev-secret-change-me-in-production"
config_encryption_key: "a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2"
otp_secret: ""
object_storage_access_key: "minioadmin"
object_storage_secret_key: "minioadmin"
# Optional secrets (safe to leave empty if the feature is unused):
redis_password: ""
fazpass_merchant_key: ""
fazpass_api_key: ""
midtrans_server_key: ""
midtrans_client_key: ""
biteship_api_key: ""
# SMTP credentials (only needed when smtp_host is set in config.yaml). For Gmail,
# smtp_username = the full address, smtp_password = a 16-char App Password.
smtp_username: ""
smtp_password: ""
